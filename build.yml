name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Doom64EX-Batocera-Port.zip -d work
      - run: sudo bash work/doom64ex/build_aarch64.sh
      - uses: actions/upload-artifact@v4
        with:
          name: doom64ex-aarch64
          path: |
            work/doom64ex/doom64ex.aarch64
            work/doom64ex/libs.aarch64
